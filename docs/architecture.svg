<g font-size="15" text-anchor="middle" fill="#16202b">
<text x="130" y="60" font-weight="bold">1. User input</text><text x="130" y="82" font-size="13">Paste text, PDF, DOCX, TXT</text>
<text x="450" y="60" font-weight="bold">2. Text extraction</text><text x="450" y="82" font-size="13">pdf.js, mammoth.js, FileReader</text>
<text x="770" y="60" font-weight="bold">3. Parser</text><text x="770" y="82" font-size="13">Sections, bullets, contact</text>
<text x="155" y="203" font-weight="bold">4a. Skill matcher</text><text x="155" y="225" font-size="13">Alias dictionary, role or JD target</text>
